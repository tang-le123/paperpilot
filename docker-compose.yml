services:
  paperpilot:
    build: .
    container_name: paperpilot
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    working_dir: /app/backend
    env_file:
      - .env
    environment:
      EMBEDDING_MODEL: /models/bge-m3
      RERANK_MODEL: /models/bge-reranker-base
      RERANK_DEVICE: cpu
      OCR_ENABLED: "true"
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ${MODELS_DIR:-E:/all-in-rag/models}:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 20
